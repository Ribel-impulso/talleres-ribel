<title>Panel de talleres</title>

<style>
/* Layout: una columna, selector de taller arriba, dos bloques de acción (antes / después) y lista de inscriptas */
:root{
  --bg:#faf5f0; --card:#ffffff; --text:#2d2420; --muted:#6f625a;
  --accent:#b5566b; --accent2:#8a3a4d; --btn:#8a3a4d; --btn-hover:#b5566b;
  --line:#eadfd6; --soft:#f5e6e9; --on-btn:#ffffff;
  --warn-bg:#fbefd9; --warn-tx:#7a4a0a; --ok-bg:#e3f2e6; --ok-tx:#1f5a2c;
  --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1614; --card:#272019; --text:#f3ebe5; --muted:#b9aca3;
    --accent:#e08a9f; --accent2:#e08a9f; --btn:#a8475f; --btn-hover:#c05a74;
    --line:#3a2f29; --soft:#34242a;
    --warn-bg:#3b2d14; --warn-tx:#f1cf8f; --ok-bg:#173023; --ok-tx:#a8dcb4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1614; --card:#272019; --text:#f3ebe5; --muted:#b9aca3;
  --accent:#e08a9f; --accent2:#e08a9f; --btn:#a8475f; --btn-hover:#c05a74;
  --line:#3a2f29; --soft:#34242a;
  --warn-bg:#3b2d14; --warn-tx:#f1cf8f; --ok-bg:#173023; --ok-tx:#a8dcb4; color-scheme:dark;
}

h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.tag{font-size:.74rem;border:1px solid var(--accent);color:var(--accent2);border-radius:999px;padding:2px 10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:auto;white-space:nowrap}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tab{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font:600 .9rem var(--body);cursor:pointer;min-width:0}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:800 1.35rem var(--display);color:var(--accent2)}
.stat span{font-size:.78rem;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.box h2{font-size:1.02rem;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.box p.d{margin:0 0 10px;color:var(--muted);font-size:.86rem}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px}
input[type=text],select,textarea{width:100%;font:.95rem var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.btn{display:inline-block;background:var(--btn);color:var(--on-btn);border:0;border-radius:999px;padding:11px 18px;font:600 .92rem var(--body);cursor:pointer;text-align:center}
.btn:hover{background:var(--btn-hover)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.file{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.file .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.file .nm small{display:block;color:var(--muted)}
.cert{border:1px solid var(--line);border-radius:12px;background:var(--bg);aspect-ratio:1.414/1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;gap:4px;margin-bottom:8px}

 {n:"Masaje circulatorio",d:"Sáb 7/11",zoom:"",mat:null,rows:[
  {n:"María Gómez",m:"maria.gomez@mail.com",k:"r",p:"$9.000",s:0,z:false},
  {n:"Julieta Bravo",m:"julieta.b@mail.com",k:"v",p:"$15.000",s:0,z:false}]},
 {n:"Masaje con vela de soja",d:"Sáb 10/10",zoom:"https://us02web.zoom.us/j/83598765432",mat:"Material-vela-de-soja.pdf",rows:[
  {n:"Carla Ruiz",m:"carla.ruiz@mail.com",k:"v",p:"$15.000",s:2,z:true},
  {n:"Paula Sosa",m:"paula.s@mail.com",k:"r",p:"$10.000",s:1,z:false}]},
 {n:"Facial con elementos",d:"Sáb 28/11",zoom:"",mat:null,rows:[]},
 {n:"Piedras calientes",d:"Sin fecha",fecha:"",wl:[
  {n:"Rocío Vera",w:"+54 9 3492 555111",s:0},
  {n:"Sol Benítez",w:"+54 9 3492 555222",s:0},
  {n:"Marta Díaz",w:"+54 9 3492 555333",s:1}]}
];
var cur=0, ask=null, certIdx=0, tt=null;
var ST=["Pendiente","Pagó","Entregado"], NX=["Marcar pagó","Marcar entregado"];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2600)}
function zoomTargets(t){return t.rows.filter(function(r){return r.s>=1&&r.k==='v'&&!r.z})}
function entTargets(t){return t.rows.filter(function(r){return r.s===1})}
function fill(txt,r,t){return txt.replace(/\{nombre\}/g,r.n.split(' ')[0]).replace(/\{taller\}/g,t.n.toLowerCase()).replace(/\{fecha\}/g,(t.fecha||'').trim()||'(fecha)')}
function prevHtml(t){var r=t.wl[0];return r?esc(fill(MSG,r,t)):''}
function tabsHtml(){return T.map(function(x,i){return '<button class="tab" type="button" data-a="tab" data-i="'+i+'" aria-pressed="'+(i===cur)+'">'+esc(x.n)+'<small>'+x.d+'</small></button>'}).join('')}
function statBox(n,l){return '<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>'}
function render(){
  var t=T[cur];
  document.getElementById('tabs').innerHTML=tabsHtml();
  if(t.wl){
    var w=[0,0];t.wl.forEach(function(r){w[r.s]++});
    document.getElementById('sectT').textContent='Lista de espera';
    document.getElementById('stats').innerHTML=statBox(t.wl.length,'Pidieron aviso')+statBox(w[0],'Sin avisar')+statBox(w[1],'Avisadas');
    var f=t.wl[0];
    document.getElementById('blocks').innerHTML='<div class="box"><h2>Avisar la fecha</h2><p class="d">Cuando definas la fecha, escribila acá y el mensaje sale armado con el nombre de cada persona.</p>'+
      '<label class="fld" for="fe"><span>Fecha del taller</span><input id="fe" type="text" value="'+esc(t.fecha)+'" placeholder="Ej: sábado 5/12 a las 14 hs"></label>'+
      '<label class="fld" for="mj"><span>Mensaje</span><textarea id="mj" rows="5">'+esc(MSG)+'</textarea></label>'+
      '<p class="note">Se completa solo: {nombre}, {taller} y {fecha}.</p>'+
      (f?'<p class="note" style="margin-bottom:4px"><b>Así le llega a '+esc(f.n.split(' ')[0])+':</b></p><div class="ask" id="prev" style="margin-top:0">'+prevHtml(t)+'</div>':'')+
      '<p class="err" id="errf" style="margin-top:8px"></p></div>';
    document.getElementById('list').innerHTML=t.wl.length?t.wl.map(function(r,j){
      return '<div class="row"><div class="hd"><div class="nm"><b>'+esc(r.n)+'</b><small>'+esc(r.w)+'</small></div><span class="pill p'+(r.s?2:0)+'">'+(r.s?'Avisada':'En espera')+'</span></div>'+
      '<div class="ac one"><button class="btn" type="button" data-a="wav" data-j="'+j+'">'+(r.s?'Avisar de nuevo por WhatsApp':'Avisar por WhatsApp')+'</button></div>'+
      (r.s?'<button class="back" type="button" data-a="wback" data-j="'+j+'">Me equivoqué, volver a En espera</button>':'')+'</div>'
    }).join(''):'<div class="box"><h2>Nadie pidió aviso todavía</h2><p class="d" style="margin:0">Cuando alguien toque "Avisame cuando tenga fecha", aparece acá.</p></div>';
    return;
  }
  document.getElementById('sectT').textContent='Inscriptas';
  var c=[0,0,0];t.rows.forEach(function(r){c[r.s]++});
  document.getElementById('stats').innerHTML=statBox(t.rows.length,'Anotadas')+statBox(c[1]+c[2],'Pagaron')+statBox(c[2],'Entregadas');
  var zt=zoomTargets(t).length, et=entTargets(t).length;
  var paid=t.rows.filter(function(r){return r.s>=1});
  if(certIdx>=paid.length)certIdx=0;
  var nom=paid.length?paid[certIdx].n:'Nombre y apellido';
  var b='';
  b+='<div class="box"><h2>Antes del taller</h2><p class="d">Link de Zoom para las que pagaron el taller en vivo.</p>'+
    '<label class="fld" for="zoom"><span>Link de Zoom</span><input id="zoom" type="text" value="'+esc(t.zoom)+'" placeholder="Pegá el link de Zoom"></label>'+
    '<p class="err" id="errz"></p>'+
    '<button class="btn full" type="button" data-a="askz"'+(zt?'':' disabled')+'>Enviar link de Zoom ('+zt+')</button>'+
    (zt?'':'<p class="note" style="margin-top:8px">No hay pagos nuevos en vivo para avisar.</p>');
  if(ask==='z'){b+='<div class="ask">Se enviaría un mail con el link de Zoom a <b>'+zt+'</b> persona'+(zt===1?'':'s')+'. Las que compraron solo grabación no lo reciben.<div class="acts"><button class="btn" type="button" data-a="okz">Enviar ahora</button><button class="btn ghost" type="button" data-a="no">Cancelar</button></div></div>'}
  b+='</div>';
  b+='<div class="box"><h2>Después del taller</h2><p class="d">Material y certificado, para todas las que pagaron.</p>'+
    '<div class="file"><div class="nm">'+(t.mat?esc(t.mat)+'<small>Se manda como link de descarga</small>':'Todavía no subiste el material')+'</div><button class="btn ghost" type="button" data-a="mat">'+(t.mat?'Cambiar':'Subir PDF')+'</button></div>'+
    '<div class="cert"><div class="lg"></div><div class="k">Certificado de participación</div><div class="s">Se otorga a</div><div class="nom">'+esc(nom)+'</div><div class="s">por participar del taller</div><div class="t">'+esc(t.n)+'</div><div class="fi">Firma</div></div>'+
    '<p class="note">Vista previa. Acá va tu diseño, con el nombre de cada persona.</p>'+
    (paid.length?'<label class="fld" for="cs"><span>Ver con el nombre de</span><select id="cs">'+paid.map(function(r,i){return '<option value="'+i+'"'+(i===certIdx?' selected':'')+'>'+esc(r.n)+'</option>'}).join('')+'</select></label>':'')+
    '<p class="err" id="erre"></p>'+
    '<button class="btn full" type="button" data-a="aske"'+(et?'':' disabled')+'>Enviar material y certificado ('+et+')</button>'+
    (et?'':'<p class="note" style="margin-top:8px">No hay pagos pendientes de entrega.</p>');
  if(ask==='e'){b+='<div class="ask">Se enviaría un mail con el material y el certificado a <b>'+et+'</b> persona'+(et===1?'':'s')+', cada una con su nombre, y pasarían a Entregado.<div class="acts"><button class="btn" type="button" data-a="oke">Enviar ahora</button><button class="btn ghost" type="button" data-a="no">Cancelar</button></div></div>'}
  b+='</div>';
  document.getElementById('blocks').innerHTML=b;
  document.getElementById('list').innerHTML=t.rows.length?t.rows.map(function(r,j){
    var fwd=r.s<2?'<button class="btn" type="button" data-a="st" data-j="'+j+'">'+NX[r.s]+'</button>':'';
    var back=r.s>0?'<button class="back" type="button" data-a="back" data-j="'+j+'">'+(r.s===1?'Me equivoqué, volver a Pendiente':'Volver a Pagó')+'</button>':'';
    return '<div class="row"><div class="hd"><div class="nm"><b>'+esc(r.n)+'</b><small>'+esc(r.m)+'</small></div><span class="pill p'+r.s+'">'+ST[r.s]+'</span></div>'+
    '<div class="chips"><span class="chip">'+(r.k==='v'?'En vivo':'Solo grabación')+'</span><span class="chip">'+esc(r.p)+'</span>'+(r.z?'<span class="chip">Zoom enviado</span>':'')+'</div>'+
    '<div class="ac'+(r.s===2?' one':'')+'"><button class="btn ghost" type="button" data-a="wa" data-j="'+j+'">Escribir por WhatsApp</button>'+fwd+'</div>'+back+'</div>'
  }).join(''):'<div class="box"><h2>Todavía no hay inscriptas</h2><p class="d" style="margin:0">Cuando alguien se anote en este taller, aparece acá.</p></div>';
}
document.addEventListener('input',function(e){
  var t=T[cur];
  if(e.target.id==='zoom')t.zoom=e.target.value;
  if(e.target.id==='fe'){t.fecha=e.target.value;var p=document.getElementById('prev');if(p)p.textContent=fill(MSG,t.wl[0],t)}
  if(e.target.id==='mj'){MSG=e.target.value;var q=document.getElementById('prev');if(q)q.textContent=fill(MSG,t.wl[0],t)}
});
document.addEventListener('change',function(e){if(e.target.id==='cs'){certIdx=+e.target.value;var y=window.scrollY;render();window.scrollTo(0,y)}});
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!b.dataset.a)return;
  var a=b.dataset.a,t=T[cur];
  if(a==='tab'){cur=+b.dataset.i;ask=null;certIdx=0;render();return}
  if(a==='st'){var r=t.rows[+b.dataset.j];if(r.s<2)r.s++;render();return}
  if(a==='back'){var q=t.rows[+b.dataset.j];if(q.s>0)q.s--;render();toast(q.n+' volvió a '+ST[q.s]);return}
  if(a==='wa'){toast('Se abriría WhatsApp con '+t.rows[+b.dataset.j].n);return}
  if(a==='wav'){
    var w=t.wl[+b.dataset.j];
    if(!(t.fecha||'').trim()){render();document.getElementById('errf').textContent='Escribí primero la fecha del taller.';return}
    w.s=1;render();toast('Se abriría WhatsApp con el mensaje para '+w.n);return}
  if(a==='wback'){var v=t.wl[+b.dataset.j];v.s=0;render();toast(v.n+' volvió a En espera');return}
  if(a==='mat'){t.mat='Material-'+t.n.toLowerCase().replace(/[^a-z]+/g,'-')+'.pdf';render();toast('Material subido');return}
  if(a==='askz'){if(!t.zoom.trim()){render();document.getElementById('errz').textContent='Pegá primero el link de Zoom.';return}ask='z';render();return}
  if(a==='aske'){if(!t.mat){render();document.getElementById('erre').textContent='Subí primero el material en PDF.';return}ask='e';render();return}
  if(a==='no'){ask=null;render();return}
  if(a==='okz'){var n=zoomTargets(t);n.forEach(function(r){r.z=true});ask=null;render();toast('Link de Zoom enviado a '+n.length+' (ejemplo)');return}
  if(a==='oke'){var m=entTargets(t);m.forEach(function(r){r.s=2});ask=null;render();toast('Material y certificado enviados a '+m.length+' (ejemplo)');return}
});
render();
</script>

</body></html>
