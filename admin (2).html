<title>Panel de talleres</title>

<style>
/* Panel conectado a Supabase: login, pestañas de talleres activos ordenadas por fecha, inscriptas y lista de espera */
:root{
  --bg:#faf5f0; --card:#ffffff; --text:#2d2420; --muted:#6f625a;
  --accent:#b5566b; --accent2:#8a3a4d; --btn:#8a3a4d; --btn-hover:#b5566b;
  --line:#eadfd6; --soft:#f5e6e9; --on-btn:#ffffff;
  --warn-bg:#fbefd9; --warn-tx:#7a4a0a; --ok-bg:#e3f2e6; --ok-tx:#1f5a2c;
  --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1614; --card:#272019; --text:#f3ebe5; --muted:#b9aca3;
    --accent:#e08a9f; --accent2:#e08a9f; --btn:#a8475f; --btn-hover:#c05a74;
    --line:#3a2f29; --soft:#34242a;
    --warn-bg:#3b2d14; --warn-tx:#f1cf8f; --ok-bg:#173023; --ok-tx:#a8dcb4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1614; --card:#272019; --text:#f3ebe5; --muted:#b9aca3;
  --accent:#e08a9f; --accent2:#e08a9f; --btn:#a8475f; --btn-hover:#c05a74;
  --line:#3a2f29; --soft:#34242a;

}

h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.tag{font-size:.74rem;border:1px solid var(--accent);color:var(--accent2);border-radius:999px;padding:2px 10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:auto;white-space:nowrap}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tab{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font:600 .9rem var(--body);cursor:pointer;min-width:0}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:800 1.35rem var(--display);color:var(--accent2)}
.stat span{font-size:.78rem;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.box h2{font-size:1.02rem;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.box p.d{margin:0 0 10px;color:var(--muted);font-size:.86rem}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px}
input[type=text],select,textarea{width:100%;font:.95rem var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.btn{display:inline-block;background:var(--btn);color:var(--on-btn);border:0;border-radius:999px;padding:11px 18px;font:600 .92rem var(--body);cursor:pointer;text-align:center}
.btn:hover{background:var(--btn-hover)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.file{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.file .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.file .nm small{display:block;color:var(--muted)}
.cert{border:1px solid var(--line);border-radius:12px;background:var(--bg);aspect-ratio:1.414/1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;gap:4px;margin-bottom:8px}

.cert .k{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cert .t{font:800 1rem var(--display)}
.cert .nom{font:800 1.35rem var(--display);color:var(--accent2);overflow-wrap:anywhere}
.cert .s{font-size:.72rem;color:var(--muted)}
.cert .fi{width:90px;border-top:1px solid var(--muted);margin-top:8px;font-size:.62rem;color:var(--muted);padding-top:2px}
.note{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.ask{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;font-size:.9rem}
.ask .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.err{color:var(--accent2);font-weight:600;font-size:.85rem;margin:0 0 8px;min-height:1.2em}
.sect{font:800 1.05rem var(--display);margin:20px 0 8px;letter-spacing:-.01em}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:.98rem}
.row .nm small{color:var(--muted);display:block;overflow-wrap:anywhere}
.pill{font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p0{background:var(--warn-bg);color:var(--warn-tx)}
.p1{background:var(--soft);color:var(--accent2)}
.p2{background:var(--ok-bg);color:var(--ok-tx)}
.row .ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.row .ac .btn{padding:9px 10px;font-size:.86rem}
.row .ac.one{grid-template-columns:minmax(0,1fr)}
.back{background:none;border:0;color:var(--accent2);text-decoration:underline;font:600 .84rem var(--body);padding:12px 2px 2px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.72rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:.9rem;max-width:92%;z-index:5}
#toast[hidden]{display:none}
@media(min-width:560px){.tabs{grid-template-columns:repeat(4,minmax(0,1fr))}}
input[type=email],input[type=password]{width:100%;font:.95rem var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button.tag{background:none;font-family:var(--body);cursor:pointer}
.top{flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{padding:6px 10px;font-size:.8rem;line-height:1.25;max-width:min(220px,calc(50% - 3px));flex:0 1 auto}
.tab small{font-size:.7rem;margin-bottom:1px}
.tab .tn{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tab.past{opacity:.7}

.lbl{font:800 .78rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.tabs{margin-bottom:4px}
.tab.live{border-color:var(--accent);background:var(--soft)}
.tab.next{border:2px solid var(--accent);background:var(--soft);box-shadow:0 2px 10px rgba(138,58,77,.18)}
.tab .nx{display:inline-block;margin-left:6px;background:var(--accent2);color:#fff;border-radius:999px;padding:0 7px;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.prox{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

</div>
<div id="toast" role="status" hidden></div>
<script>
var SB_URL="https://ldvukasrgskzrmskrqde.supabase.co";
var SB_KEY="sb_publishable_ixATKY00uzUmtXd5JCerfw_qmSw5bsn";
var LANDING="https://talleres.ribelgestion.com";
var MSG_DEF="Hola {nombre}! Soy Maribel, de Ribel Rafaela. Ya tenemos fecha para el taller de {taller}: {fecha}. Si querés anotarte, entrá acá: "+LANDING;
var MSG=MSG_DEF;
try{MSG=localStorage.getItem('talleres_msg')||MSG_DEF}catch(e){}
var ST=["Pendiente","Pagó","Entregado"], EST=["pendiente","pago","entregado"], NX=["Marcar pagó","Marcar entregado"];
var TAL=[], INS=[], AVI=[], cur=null, SES=null, tt=null, EDIT=null, DEL=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2800)}

/* ---------- Sesión (login con Supabase) ---------- */
function loadSes(){try{SES=JSON.parse(localStorage.getItem('talleres_ses')||'null')}catch(e){SES=null}}
function saveSes(d){
  SES={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+Math.max(60,(d.expires_in||3600)-60)*1000};
  try{localStorage.setItem('talleres_ses',JSON.stringify(SES))}catch(e){}
}
function clearSes(){SES=null;try{localStorage.removeItem('talleres_ses')}catch(e){}}
function authReq(grant,body){
  return fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.text().then(function(t){
      var j={};try{j=t?JSON.parse(t):{}}catch(e){}
      if(!r.ok){var er=new Error(j.error_description||j.msg||'Error');er.status=r.status;throw er}
      return j;
    })});
}
function token(){
  if(!SES)return Promise.reject(new Error('AUTH'));
  if(Date.now()<SES.expires_at)return Promise.resolve(SES.access_token);
  return authReq('refresh_token',{refresh_token:SES.refresh_token}).then(function(d){saveSes(d);return SES.access_token})
    .catch(function(e){throw e.status?new Error('AUTH'):e});
}
function api(path,o){
  o=o||{};
  return token().then(function(tk){
    return fetch(SB_URL+'/rest/v1/'+path,{method:o.method||'GET',
      headers:{apikey:SB_KEY,Authorization:'Bearer '+tk,'Content-Type':'application/json',Prefer:o.rep?'return=representation':'return=minimal'},
      body:o.body?JSON.stringify(o.body):undefined});
  }).then(function(r){
    if(r.status===401)throw new Error('AUTH');
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function patch(tabla,id,datos){
  return api(tabla+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:datos,rep:true}).then(function(r){
    if(!r||!r.length)throw new Error('NOSAVE');
  });
}
function fallo(e){
  if(e&&e.message==='AUTH'){clearSes();showLogin('La sesión venció. Entrá de nuevo.');return}
  toast('No se pudo guardar. Probá de nuevo.');
}

/* ---------- Datos ---------- */
function cargar(){
  return Promise.all([
    api('talleres?select=*'),
    api('inscripciones?select=*&order=creado_en.asc'),
    api('avisos?select=*&order=creado_en.asc')
  ]).then(function(r){TAL=r[0]||[];INS=r[1]||[];AVI=r[2]||[]});
}
function rowsOf(t){return INS.filter(function(x){return x.taller===t.nombre})}
function wlOf(t){return AVI.filter(function(x){return x.taller===t.nombre})}
function act(t){return rowsOf(t).length+wlOf(t).length}
function ordenados(){return TAL.slice().sort(function(a,b){var d=act(b)-act(a);if(d)return d;return a.nombre<b.nombre?-1:1})}
function curT(){return TAL.filter(function(x){return x.id===cur})[0]}
function money(r){
  if(r.precio==null)return '';
  var v=Number(r.precio),s=(v%1===0?String(v):v.toFixed(2)).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (r.moneda==='USD'?'USD ':'$')+s.join(',');
}
function waNum(w){
  var d=String(w||'').replace(/\D/g,'');
  if(d.indexOf('54')===0){if(d.charAt(2)!=='9')d='549'+d.slice(2);return d}
  d=d.replace(/^0+/,'');
  var m=d.match(/^(\d{2,4})15(\d{6,8})$/);
  if(m&&(m[1].length+m[2].length)===10)d=m[1]+m[2];
  return '549'+d;
}
function fill(txt,r,t){
  return txt.replace(/\{nombre\}/g,String(r.nombre||'').split(' ')[0]).replace(/\{taller\}/g,t.nombre.toLowerCase()).replace(/\{fecha\}/g,(t.fecha||'').trim()||'(fecha)');
}
function statBox(n,l){return '<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>'}

/* ---------- Pantallas ---------- */
function showLogin(msg){
  $('app').hidden=true;$('login').hidden=false;$('btnAct').hidden=true;$('btnOut').hidden=true;
  $('lerr').textContent=msg||'';
}
function showApp(){
  $('login').hidden=true;$('app').hidden=false;$('btnAct').hidden=false;$('btnOut').hidden=false;
}
var DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function activo(t){return fechaDe(t)!==null}
function pendPago(t){return rowsOf(t).filter(function(r){return r.estado==='pendiente'}).length}
function sinAvisar(t){return wlOf(t).filter(function(r){return r.estado!=='avisado'}).length}
function paraAtender(t){return pendPago(t)+sinAvisar(t)}
function hoy0(){var h=new Date();return new Date(h.getFullYear(),h.getMonth(),h.getDate())}
function fechaDe(t){
  var m=String(t.fecha||'').match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(!m)return null;
  var d=+m[1],mo=+m[2];
  if(mo<1||mo>12||d<1||d>31)return null;
  var h=hoy0(),f=new Date(h.getFullYear(),mo-1,d);
  if(f.getTime()<h.getTime()-60*864e5)f=new Date(h.getFullYear()+1,mo-1,d);
  return f;
}
function porNombre(a,b){return a.nombre<b.nombre?-1:1}
/* Orden: próximos por fecha, después los sin fecha, después los que ya pasaron */
function activosOrd(){
  var h=hoy0().getTime();
  function g(t){var f=fechaDe(t);return f===null?1:(f.getTime()>=h?0:2)}
  return TAL.filter(activo).sort(function(a,b){
    var ga=g(a),gb=g(b);if(ga!==gb)return ga-gb;
    var fa=fechaDe(a),fb=fechaDe(b);
    if(ga===0)return fa-fb||porNombre(a,b);
    if(ga===2)return fb-fa||porNombre(a,b);
    return porNombre(a,b);
  });
}
function proximoId(){
  var h0=hoy0().getTime(),r=null;
  activosOrd().forEach(function(x){var f=fechaDe(x);if(!r&&f&&f.getTime()>=h0)r=x.id});
  return r;
}
function labFecha(x){
  var f=fechaDe(x),h0=hoy0().getTime();
  return f?DIAS[f.getDay()]+' '+f.getDate()+'/'+(f.getMonth()+1)+(f.getTime()<h0?' · pasó':''):'Sin fecha';
}
function tabsHtml(t,lista){
  var h0=hoy0().getTime(),nx=proximoId();
  return lista.map(function(x){
    var f=fechaDe(x),p=paraAtender(x),pasado=f&&f.getTime()<h0,es=x.id===nx;
    return '<button class="tab'+(pasado?' past':' live')+(es?' next':'')+'" type="button" data-a="tab" data-id="'+esc(x.id)+'" aria-pressed="'+(!!t&&x.id===t.id)+'">'+
      '<small>'+labFecha(x)+(es?'<span class="nx">Próximo</span>':'')+(p?'<span class="bd">'+p+'</span>':'')+'</small><span class="tn">'+esc(x.nombre)+'</span></button>';
  }).join('');
}
/* ---------- Grupos desplegables: con fecha / próximamente / ya pasaron ---------- */
var OPEN={prox:true,sinf:false,pas:false};
function grupoDe(x){
  var f=fechaDe(x);
  if(f===null)return 'sinf';
  return f.getTime()>=hoy0().getTime()?'prox':'pas';
}
function grupoHtml(g,titulo,items,t,vacio){
  var cnt=items.reduce(function(n,x){return n+paraAtender(x)},0);
  var abierto=OPEN[g];
  var cuerpo;
  if(!items.length)cuerpo='<p class="note">'+vacio+'</p>';
  else if(g==='sinf')cuerpo='<div class="prox">'+items.map(function(x){
    var p=paraAtender(x);
    return '<button class="pchip" type="button" data-a="tab" data-id="'+esc(x.id)+'" aria-pressed="'+(!!t&&x.id===t.id)+'">'+esc(x.nombre)+(p?'<span class="bd">'+p+'</span>':'')+'</button>';
  }).join('')+'</div>';
  else cuerpo='<div class="tabs">'+tabsHtml(t,items)+'</div>';
  return '<details class="grp" data-g="'+g+'"'+(abierto?' open':'')+'><summary><span>'+titulo+'</span><span class="cn">'+items.length+'</span>'+(cnt?'<span class="bd">'+cnt+' para atender</span>':'')+'</summary>'+cuerpo+'</details>';
}
function gruposHtml(t){
  var ac=activosOrd(),h0=hoy0().getTime();
  var prox=ac.filter(function(x){return fechaDe(x).getTime()>=h0});
  var pas=ac.filter(function(x){return fechaDe(x).getTime()<h0});
  var sin=TAL.filter(function(x){return !activo(x)}).sort(porNombre);
  return grupoHtml('prox','Talleres con fecha',prox,t,'No hay talleres con fecha próxima.')+
    grupoHtml('sinf','Próximamente · sin fecha',sin,t,'No hay talleres sin fecha.')+
    (pas.length?grupoHtml('pas','Ya pasaron',pas,t,''):'');
}
function editForm(kind,r){
  var h='<div class="ask"><label class="fld"><span>Nombre</span><input id="en" type="text" value="'+esc(r.nombre)+'"></label>'+
    '<label class="fld"><span>Mail</span><input id="ee" type="text" value="'+esc(r.email)+'"></label>'+
    '<label class="fld"><span>WhatsApp</span><input id="ew" type="text" value="'+esc(r.whatsapp)+'"></label>';
  if(kind==='i')h+='<label class="fld"><span>Modalidad</span><select id="em"><option value="vivo"'+(r.modalidad==='vivo'?' selected':'')+'>En vivo</option><option value="grabacion"'+(r.modalidad!=='vivo'?' selected':'')+'>Solo grabación</option></select></label>';
  h+='<div class="acts"><button class="btn" type="button" data-a="saveedit" data-k="'+kind+'" data-id="'+esc(r.id)+'">Guardar cambios</button><button class="btn ghost" type="button" data-a="cancel">Cancelar</button></div></div>';
  return h;
}
function tools(kind,r){
  if(EDIT!==null&&String(EDIT)===String(r.id))return editForm(kind,r);
  if(DEL!==null&&String(DEL)===String(r.id))return '<div class="ask danger">¿Eliminar a <b>'+esc(r.nombre)+'</b>? No se puede deshacer.<div class="acts"><button class="btn warn" type="button" data-a="delok" data-k="'+kind+'" data-id="'+esc(r.id)+'">Sí, eliminar</button><button class="btn ghost" type="button" data-a="cancel">No, dejar</button></div></div>';
  return '<div class="mini"><button class="back" type="button" data-a="edit" data-id="'+esc(r.id)+'">Corregir datos</button><button class="back danger" type="button" data-a="del" data-id="'+esc(r.id)+'">Eliminar</button></div>';
}
function render(){
  var t=curT();
  if(!t){var ac=activosOrd();t=ac[0]||TAL.slice().sort(porNombre)[0];if(t){cur=t.id;OPEN[grupoDe(t)]=true}}
  $('grupos').innerHTML=gruposHtml(t);
  if(!t){
    $('stats').innerHTML='';$('list').innerHTML='';
    $('blocks').innerHTML='<div class="box"><h2>No hay talleres cargados</h2><p class="d" style="margin:0">Revisá la tabla talleres en Supabase.</p></div>';
    return;
  }
  var rows=rowsOf(t),wl=wlOf(t);
  var c=[0,0,0];rows.forEach(function(r){var s=EST.indexOf(r.estado);c[s<0?0:s]++});
  $('stats').innerHTML=statBox(rows.length,'Anotadas')+statBox(c[1]+c[2],'Pagaron')+statBox(c[2],'Entregadas');
  var sinF=!String(t.fecha||'').trim();
  var b='<details class="box"'+(sinF?' open':'')+'><summary>Datos del taller</summary><p class="d">La fecha y el link de Zoom quedan guardados para este taller.</p>'+
    '<label class="fld" for="fe"><span>Fecha del taller</span><input id="fe" type="text" value="'+esc(t.fecha)+'" placeholder="Ej: sábado 5/12 a las 14 hs"></label>'+
    '<label class="fld" for="zoom"><span>Link de Zoom</span><input id="zoom" type="text" value="'+esc(t.zoom_link)+'" placeholder="Pegá el link de Zoom"></label>'+
    '<button class="btn full" type="button" data-a="savet">Guardar datos</button></details>';
  if(wl.length){
    b+='<details class="box"><summary>Mensaje para la lista de espera</summary><p class="d">Las personas que pidieron aviso reciben un mensaje armado con su nombre. La fecha sale de "Datos del taller".</p>'+
      '<label class="fld" for="mj"><span>Mensaje</span><textarea id="mj" rows="5">'+esc(MSG)+'</textarea></label>'+
      '<p class="note">Se completa solo: {nombre}, {taller} y {fecha}.</p>'+
      '<p class="note" style="margin-bottom:4px"><b>Así le llega a '+esc(String(wl[0].nombre).split(' ')[0])+':</b></p><div class="ask" id="prev" style="margin-top:0">'+esc(fill(MSG,wl[0],t))+'</div>'+
      '<p class="err" id="errf" style="margin-top:8px"></p></details>';
  }
  b+='<details class="box"><summary>Envío por mail</summary><p class="d" style="margin:0">El envío del link de Zoom, del material en PDF y de los certificados lo conectamos en el próximo paso. Por ahora podés escribirles por WhatsApp desde cada tarjeta.</p></details>';
  $('blocks').innerHTML=b;
  var l='';
  if(wl.length){
    l+='<div class="sect">Lista de espera</div>'+wl.map(function(r){
      var av=r.estado==='avisado';
      return '<div class="row"><div class="hd"><div class="nm"><b>'+esc(r.nombre)+'</b><small>'+esc(r.whatsapp)+(r.email?' · '+esc(r.email):'')+'</small></div><span class="pill p'+(av?2:0)+'">'+(av?'Avisada':'En espera')+'</span></div>'+
        '<div class="ac one"><button class="btn" type="button" data-a="wav" data-id="'+esc(r.id)+'">'+(av?'Avisar de nuevo por WhatsApp':'Avisar por WhatsApp')+'</button></div>'+
        (av?'<button class="back" type="button" data-a="wback" data-id="'+esc(r.id)+'">Me equivoqué, volver a En espera</button>':'')+tools('a',r)+'</div>';
    }).join('');
  }
  l+='<div class="sect">Inscriptas</div>';
  l+=rows.length?rows.map(function(r){
    var s=EST.indexOf(r.estado);if(s<0)s=0;
    var fwd=s<2?'<button class="btn" type="button" data-a="st" data-id="'+esc(r.id)+'">'+NX[s]+'</button>':'';
    var back=s>0?'<button class="back" type="button" data-a="back" data-id="'+esc(r.id)+'">'+(s===1?'Me equivoqué, volver a Pendiente':'Volver a Pagó')+'</button>':'';
    return '<div class="row"><div class="hd"><div class="nm"><b>'+esc(r.nombre)+'</b><small>'+esc(r.email)+' · '+esc(r.whatsapp)+'</small></div><span class="pill p'+s+'">'+ST[s]+'</span></div>'+
      '<div class="chips"><span class="chip">'+(r.modalidad==='vivo'?'En vivo':'Solo grabación')+'</span>'+(money(r)?'<span class="chip">'+esc(money(r))+'</span>':'')+(r.zoom_enviado?'<span class="chip">Zoom enviado</span>':'')+'</div>'+
      '<div class="ac'+(s===2?' one':'')+'"><button class="btn ghost" type="button" data-a="wa" data-id="'+esc(r.id)+'">Escribir por WhatsApp</button>'+fwd+'</div>'+back+tools('i',r)+'</div>';
  }).join(''):'<div class="box"><h2>Todavía no hay inscriptas</h2><p class="d" style="margin:0">Cuando alguien se anote en este taller, aparece acá.</p></div>';
  $('list').innerHTML=l;
}
function start(){
  cur=null;EDIT=null;DEL=null;
  showApp();
  $('grupos').innerHTML='';$('stats').innerHTML='';$('list').innerHTML='';
  $('blocks').innerHTML='<div class="box"><p class="d" style="margin:0">Cargando…</p></div>';
  cargar().then(render).catch(function(e){
    if(e&&e.message==='AUTH'){clearSes();showLogin('La sesión venció. Entrá de nuevo.');return}
    $('blocks').innerHTML='<div class="box"><h2>No se pudo cargar</h2><p class="d">Revisá tu conexión y probá de nuevo.</p><button class="btn" type="button" data-a="act">Reintentar</button></div>';
  });
}

/* ---------- Eventos ---------- */
$('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  $('lerr').textContent='';$('lgo').disabled=true;$('lgo').textContent='Entrando…';
  authReq('password',{email:$('lm').value.trim(),password:$('lp').value})
    .then(function(d){saveSes(d);$('lp').value='';start()})
    .catch(function(er){$('lerr').textContent=(er.status===400||er.status===401)?'Mail o contraseña incorrectos.':'No se pudo conectar. Probá de nuevo.'})
    .then(function(){$('lgo').disabled=false;$('lgo').textContent='Entrar'});
});
$('btnOut').addEventListener('click',function(){clearSes();TAL=[];INS=[];AVI=[];cur=null;showLogin('')});
$('btnAct').addEventListener('click',function(){cargar().then(function(){render();toast('Actualizado')}).catch(fallo)});
document.addEventListener('input',function(e){
  var t=curT();if(!t)return;
  if(e.target.id==='fe'){t.fecha=e.target.value;var p=$('prev'),w=wlOf(t)[0];if(p&&w)p.textContent=fill(MSG,w,t)}
  if(e.target.id==='zoom')t.zoom_link=e.target.value;
  if(e.target.id==='mj'){MSG=e.target.value;try{localStorage.setItem('talleres_msg',MSG)}catch(x){}var q=$('prev'),w2=wlOf(t)[0];if(q&&w2)q.textContent=fill(MSG,w2,t)}
});
document.addEventListener('change',function(e){
  if(e.target.id==='otro'&&e.target.value){cur=e.target.value;render();window.scrollTo(0,0)}
});
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!b.dataset.a)return;
  var a=b.dataset.a,id=b.dataset.id,t=curT();
  if(a==='tab'){cur=id;EDIT=null;DEL=null;render();window.scrollTo(0,0);return}
  if(a==='act'){start();return}
  if(a==='savet'){
    t.fecha=($('fe').value||'').trim();t.zoom_link=($('zoom').value||'').trim();
    patch('talleres',t.id,{fecha:t.fecha||null,zoom_link:t.zoom_link||null}).then(function(){render();toast('Datos guardados')}).catch(fallo);
    return;
  }
  if(a==='st'||a==='back'){
    var r=INS.filter(function(x){return x.id===id})[0];if(!r)return;
    var s=EST.indexOf(r.estado),n=a==='st'?s+1:s-1;
    if(n<0||n>2)return;
    patch('inscripciones',id,{estado:EST[n]}).then(function(){r.estado=EST[n];render();if(a==='back')toast(r.nombre+' volvió a '+ST[n])}).catch(fallo);
    return;
  }
  if(a==='wa'){
    var q=INS.filter(function(x){return x.id===id})[0];if(!q)return;
    window.open('https://wa.me/'+waNum(q.whatsapp),'_blank');return;
  }
  if(a==='wav'){
    var w=AVI.filter(function(x){return x.id===id})[0];if(!w)return;
    var fecha=($('fe')?$('fe').value:(t.fecha||'')).trim();
    if(!fecha){$('errf').textContent='Escribí primero la fecha del taller, arriba en "Datos del taller".';return}
    t.fecha=fecha;
    window.open('https://wa.me/'+waNum(w.whatsapp)+'?text='+encodeURIComponent(fill(MSG,w,t)),'_blank');
    Promise.all([patch('avisos',w.id,{estado:'avisado'}),patch('talleres',t.id,{fecha:fecha})])
      .then(function(){w.estado='avisado';render();toast('Marcada como avisada: '+w.nombre)}).catch(fallo);
    return;
  }
  if(a==='edit'){EDIT=id;DEL=null;render();return}
  if(a==='del'){DEL=id;EDIT=null;render();return}
  if(a==='cancel'){EDIT=null;DEL=null;render();return}
  if(a==='saveedit'){
    var k=b.dataset.k,lst=k==='i'?INS:AVI,tb=k==='i'?'inscripciones':'avisos';
    var o=lst.filter(function(x){return String(x.id)===String(id)})[0];if(!o)return;
    var d={nombre:($('en').value||'').trim(),email:($('ee').value||'').trim()||null,whatsapp:($('ew').value||'').trim()};
    if(k==='i')d.modalidad=$('em').value;
    if(!d.nombre){toast('El nombre no puede quedar vacío');return}
    patch(tb,id,d).then(function(){for(var f in d)o[f]=d[f];EDIT=null;render();toast('Datos corregidos')}).catch(fallo);
    return;
  }
  if(a==='delok'){
    var k2=b.dataset.k,tb2=k2==='i'?'inscripciones':'avisos';
    api(tb2+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',rep:true}).then(function(r){
      if(!r||!r.length)throw new Error('NODEL');
      if(k2==='i')INS=INS.filter(function(x){return String(x.id)!==String(id)});else AVI=AVI.filter(function(x){return String(x.id)!==String(id)});
      DEL=null;render();toast('Eliminada');
    }).catch(function(e){if(e&&e.message==='NODEL'){DEL=null;render();toast('No se pudo eliminar: falta el permiso en Supabase')}else fallo(e)});
    return;
  }
  if(a==='wback'){
    var v=AVI.filter(function(x){return x.id===id})[0];if(!v)return;
    patch('avisos',id,{estado:'espera'}).then(function(){v.estado='espera';render();toast(v.nombre+' volvió a En espera')}).catch(fallo);
    return;
  }
});

document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.classList&&d.classList.contains('grp')&&d.dataset.g)OPEN[d.dataset.g]=d.open},true);

loadSes();
if(SES)start();else showLogin('');
</script>
