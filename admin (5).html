<title>Panel de talleres</title>

<style>
/* Panel conectado a Supabase: login, pestañas de talleres activos ordenadas por fecha, inscriptas y lista de espera */
:root{
  --bg:#faf5f0; --card:#ffffff; --text:#2d2420; --muted:#6f625a;
  --accent:#b5566b; --accent2:#8a3a4d; --btn:#8a3a4d; --btn-hover:#b5566b;
  --line:#eadfd6; --soft:#f5e6e9; --on-btn:#ffffff;
  --warn-bg:#fbefd9; --warn-tx:#7a4a0a; --ok-bg:#e3f2e6; --ok-tx:#1f5a2c;
  --display:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1614; --card:#272019; --text:#f3ebe5; --muted:#b9aca3;
    --accent:#e08a9f; --accent2:#e08a9f; --btn:#a8475f; --btn-hover:#c05a74;
    --line:#3a2f29; --soft:#34242a;
    --warn-bg:#3b2d14; --warn-tx:#f1cf8f; --ok-bg:#173023; --ok-tx:#a8dcb4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1614; --card:#272019; --text:#f3ebe5; --muted:#b9aca3;
  --accent:#e08a9f; --accent2:#e08a9f; --btn:#a8475f; --btn-hover:#c05a74;
  --line:#3a2f29; --soft:#34242a;

}

h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.tag{font-size:.74rem;border:1px solid var(--accent);color:var(--accent2);border-radius:999px;padding:2px 10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:auto;white-space:nowrap}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tab{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font:600 .9rem var(--body);cursor:pointer;min-width:0}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:800 1.35rem var(--display);color:var(--accent2)}
.stat span{font-size:.78rem;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.box h2{font-size:1.02rem;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.box p.d{margin:0 0 10px;color:var(--muted);font-size:.86rem}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px}
input[type=text],select,textarea{width:100%;font:.95rem var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.btn{display:inline-block;background:var(--btn);color:var(--on-btn);border:0;border-radius:999px;padding:11px 18px;font:600 .92rem var(--body);cursor:pointer;text-align:center}
.btn:hover{background:var(--btn-hover)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.file{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.file .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.file .nm small{display:block;color:var(--muted)}
.cert{border:1px solid var(--line);border-radius:12px;background:var(--bg);aspect-ratio:1.414/1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;gap:4px;margin-bottom:8px}

.cert .k{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cert .t{font:800 1rem var(--display)}
.cert .nom{font:800 1.35rem var(--display);color:var(--accent2);overflow-wrap:anywhere}
.cert .s{font-size:.72rem;color:var(--muted)}
.cert .fi{width:90px;border-top:1px solid var(--muted);margin-top:8px;font-size:.62rem;color:var(--muted);padding-top:2px}
.note{font-size:.8rem;color:var(--muted);margin:0 0 10px}
.ask{background:var(--soft);border-radius:12px;padding:12px;margin-top:10px;font-size:.9rem}
.ask .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.err{color:var(--accent2);font-weight:600;font-size:.85rem;margin:0 0 8px;min-height:1.2em}
.sect{font:800 1.05rem var(--display);margin:20px 0 8px;letter-spacing:-.01em}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:.98rem}
.row .nm small{color:var(--muted);display:block;overflow-wrap:anywhere}
details.insc{padding:0}
details.insc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px}
details.insc>summary::-webkit-details-marker{display:none}
details.insc>summary .hd{flex:1;min-width:0}
details.insc>summary::after{content:"\25BE";color:var(--accent2);font-size:1rem;flex:none}
details.insc[open]>summary::after{content:"\25B4"}
details.insc .cbody{padding:0 12px 12px;border-top:1px solid var(--line)}
.srch{margin:0 0 10px}
.srch input{width:100%;font:.95rem var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.cnt{font-size:.8rem;color:var(--muted);margin:0 0 8px}
.ck{display:flex;align-items:center;gap:8px;font-size:.9rem;min-height:40px}
.ck input{width:20px;height:20px;accent-color:var(--accent2);flex:none}
.cks{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 2px}
.pdfok{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem;margin:2px 0 10px}
input[type=file]{width:100%;font:.9rem var(--body);padding:8px 0}
.pill{font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p0{background:var(--warn-bg);color:var(--warn-tx)}
.p1{background:var(--soft);color:var(--accent2)}
.p2{background:var(--ok-bg);color:var(--ok-tx)}
.row .ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.row .ac .btn{padding:9px 10px;font-size:.86rem}
.row .ac.one{grid-template-columns:minmax(0,1fr)}
.back{background:none;border:0;color:var(--accent2);text-decoration:underline;font:600 .84rem var(--body);padding:12px 2px 2px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.72rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:.9rem;max-width:92%;z-index:5}
#toast[hidden]{display:none}
@media(min-width:560px){.tabs{grid-template-columns:repeat(4,minmax(0,1fr))}}
input[type=email],input[type=password]{width:100%;font:.95rem var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}

/* ---------- Sesión (login con Supabase) ---------- */
function loadSes(){try{SES=JSON.parse(localStorage.getItem('talleres_ses')||'null')}catch(e){SES=null}}
function saveSes(d){
  SES={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+Math.max(60,(d.expires_in||3600)-60)*1000};
  try{localStorage.setItem('talleres_ses',JSON.stringify(SES))}catch(e){}
}
function clearSes(){SES=null;try{localStorage.removeItem('talleres_ses')}catch(e){}}
function authReq(grant,body){
  return fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.text().then(function(t){
      var j={};try{j=t?JSON.parse(t):{}}catch(e){}
      if(!r.ok){var er=new Error(j.error_description||j.msg||'Error');er.status=r.status;throw er}
      return j;
    })});
}
function token(){
  if(!SES)return Promise.reject(new Error('AUTH'));
  if(Date.now()<SES.expires_at)return Promise.resolve(SES.access_token);
  return authReq('refresh_token',{refresh_token:SES.refresh_token}).then(function(d){saveSes(d);return SES.access_token})
    .catch(function(e){throw e.status?new Error('AUTH'):e});
}
function api(path,o){
  o=o||{};
  return token().then(function(tk){
    return fetch(SB_URL+'/rest/v1/'+path,{method:o.method||'GET',
      headers:{apikey:SB_KEY,Authorization:'Bearer '+tk,'Content-Type':'application/json',Prefer:o.rep?'return=representation':'return=minimal'},
      body:o.body?JSON.stringify(o.body):undefined});
  }).then(function(r){
    if(r.status===401)throw new Error('AUTH');
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function patch(tabla,id,datos){
  return api(tabla+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:datos,rep:true}).then(function(r){
    if(!r||!r.length)throw new Error('NOSAVE');
  });
}
function fallo(e){
  if(e&&e.message==='AUTH'){clearSes();showLogin('La sesión venció. Entrá de nuevo.');return}

    api('talleres?select=*'),

function money(r){
  if(r.precio==null)return '';
  var v=Number(r.precio),s=(v%1===0?String(v):v.toFixed(2)).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (r.moneda==='USD'?'USD ':'$')+s.join(',');
}
function waNum(w){
  var d=String(w||'').replace(/\D/g,'');
  if(d.indexOf('54')===0){if(d.charAt(2)!=='9')d='549'+d.slice(2);return d}
  d=d.replace(/^0+/,'');
  var m=d.match(/^(\d{2,4})15(\d{6,8})$/);
  if(m&&(m[1].length+m[2].length)===10)d=m[1]+m[2];
  return '549'+d;
}

var DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function activo(t){return fechaDe(t)!==null}
function pendPago(t){return rowsOf(t).filter(function(r){return r.estado==='pendiente'}).length}
function sinAvisar(t){return wlOf(t).filter(function(r){return r.estado!=='avisado'}).length}
function paraAtender(t){return pendPago(t)+sinAvisar(t)}
function hoy0(){var h=new Date();return new Date(h.getFullYear(),h.getMonth(),h.getDate())}
function fechaDe(t){
  var m=String(t.fecha||'').match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(!m)return null;
  var d=+m[1],mo=+m[2];
  if(mo<1||mo>12||d<1||d>31)return null;
  var h=hoy0(),f=new Date(h.getFullYear(),mo-1,d);
  if(f.getTime()<h.getTime()-60*864e5)f=new Date(h.getFullYear()+1,mo-1,d);
  return f;
}
function porNombre(a,b){return a.nombre<b.nombre?-1:1}
/* Orden: próximos por fecha, después los sin fecha, después los que ya pasaron */
function activosOrd(){
  var h=hoy0().getTime();
  function g(t){var f=fechaDe(t);return f===null?1:(f.getTime()>=h?0:2)}
  return TAL.filter(activo).sort(function(a,b){
    var ga=g(a),gb=g(b);if(ga!==gb)return ga-gb;
    var fa=fechaDe(a),fb=fechaDe(b);
    if(ga===0)return fa-fb||porNombre(a,b);
    if(ga===2)return fb-fa||porNombre(a,b);
    return porNombre(a,b);
  });
}
function proximoId(){
  var h0=hoy0().getTime(),r=null;
  activosOrd().forEach(function(x){var f=fechaDe(x);if(!r&&f&&f.getTime()>=h0)r=x.id});
  return r;
}
function labFecha(x){
  var f=fechaDe(x),h0=hoy0().getTime();
  return f?DIAS[f.getDay()]+' '+f.getDate()+'/'+(f.getMonth()+1)+(f.getTime()<h0?' · pasó':''):'Sin fecha';
}

function grupoDe(x){

function gruposHtml(t){
  var ac=activosOrd(),h0=hoy0().getTime();
  var prox=ac.filter(function(x){return fechaDe(x).getTime()>=h0});
  var pas=ac.filter(function(x){return fechaDe(x).getTime()<h0});
  var sin=TAL.filter(function(x){return !activo(x)}).sort(porNombre);
  return grupoHtml('prox','Talleres con fecha',prox,t,'No hay talleres con fecha próxima.')+
    grupoHtml('sinf','Próximamente · sin fecha',sin,t,'No hay talleres sin fecha.')+

  if(a==='mcsend'){

    var txt=($('mcmsg')?$('mcmsg').value:(c.mensaje||MC_MSG_DEF))||MC_MSG_DEF;
    window.open('https://wa.me/'+String(r.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent(mcFill(txt,r,c)),'_blank');
    var now=new Date().toISOString();
    patch('masterclass',r.id,{propuesta_enviada:now}).then(function(){r.propuesta_enviada=now;renderMc();toast('Marcado como enviado: '+r.nombre)}).catch(fallo);
    return;
  }
  if(a==='mcunsend'){
    var r2=MCA.filter(function(x){return String(x.id)===String(id)})[0];if(!r2)return;
    patch('masterclass',r2.id,{propuesta_enviada:null}).then(function(){r2.propuesta_enviada=null;renderMc();toast(r2.nombre+' volvió a Sin enviar')}).catch(fallo);
    return;
  }
  if(a==='mcsavemsg'){
    if(!c)return;var m=($('mcmsg').value||'').trim()||MC_MSG_DEF;
    patchSlug(c.slug,{mensaje:m}).then(function(){c.mensaje=m;toast('Mensaje guardado')}).catch(fallo);
    return;
  }
  if(a==='mcsave'){
    var er=$('mcerr');er.textContent='';
    var ed=!!MCEDIT,slug=($('mcslug').value||'').trim().toLowerCase();
    var fecha=$('mcfecha').value||'',titulo=($('mctitulo').value||'').trim();
    if(!titulo){er.textContent='Escribí el título.';return}
    if(!fecha){er.textContent='Elegí la fecha de la masterclass.';return}
    if(!/^[a-z0-9-]{2,30}$/.test(slug)){er.textContent='El nombre del link solo puede tener letras sin tilde, números y guiones (sin espacios).';return}
    if(!ed&&mcClase(slug)){er.textContent='Ya existe una masterclass con ese nombre de link. Cambialo.';return}
    var pts=[0,1,2].map(function(i){return ($('mcp'+i).value||'').trim()}).filter(Boolean);
    var d={taller:$('mctaller').value,titulo:titulo,bajada:($('mcbaj').value||'').trim()||null,puntos:pts,fecha:fecha,fecha_texto:mcFechaTxt(fecha),
      hora_texto:($('mchora').value||'').trim()||null,grupo_url:($('mcgrupo').value||'').trim()||null,mensaje:($('mcmsgn').value||'').trim()||MC_MSG_DEF,publicada:$('mcpub').checked};
    b.disabled=true;
    var p=ed?patchSlug(MCEDIT,d).then(function(){var k=mcClase(MCEDIT);for(var f in d)k[f]=d[f]}):
      (d.slug=slug,api('masterclass_clases',{method:'POST',body:[d],rep:true}).then(function(r){MCL.push((r&&r[0])||d)}));
    p.then(function(){MCEDIT=null;mcGo('lista');toast(ed?'Cambios guardados':'Masterclass creada')}).catch(function(x){b.disabled=false;fallo(x)});
    return;
  }
});

/* ---------- Inscriptas: buscador, fichas desplegables, aula ---------- */
var Q='', OPENI={}, PASS={}, RESETASK=null;
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function pintaInsc(){
  var el=$('inscList');if(!el)return;
  var t=curT();if(!t)return;
  var q=norm(Q).trim();
  var rows=q?INS.filter(function(r){return norm(r.nombre+' '+r.email+' '+r.whatsapp).indexOf(q)>=0}):rowsOf(t);
  var h='';
  if(q)h+='<p class="cnt">'+rows.length+(rows.length===1?' resultado':' resultados')+' en todos los talleres</p>';
  else h+='<p class="cnt">'+rows.length+(rows.length===1?' inscripta':' inscriptas')+' en este taller</p>';
  h+=rows.length?rows.map(function(r){return filaInsc(r,!!q)}).join(''):'<div class="box"><h2>'+(q?'No encontramos a nadie':'Todavía no hay inscriptas')+'</h2><p class="d" style="margin:0">'+(q?'Probá con otro nombre o mail.':'Cuando alguien se anote en este taller, aparece acá.')+'</p></div>';
  el.innerHTML=h;
}
function msgClave(p){
  return 'Hola '+String(p.nombre||'').split(' ')[0]+'! Te paso tus datos nuevos de Mi aula.\nEntrá en: talleres.ribelgestion.com/aula.html\nMail: '+p.email+'\nContraseña: '+p.password;
}
function filaInsc(r,conTaller){
  var s=EST.indexOf(r.estado);if(s<0)s=0;
  var fwd=s<2?'<button class="btn" type="button" data-a="st" data-id="'+esc(r.id)+'">'+NX[s]+'</button>':'';
  var back=s>0?'<button class="back" type="button" data-a="back" data-id="'+esc(r.id)+'">'+(s===1?'Me equivoqué, volver a Pendiente':'Volver a Pagó')+'</button>':'';
  var cuenta=r.user_id?
    '<div class="cks"><label class="ck"><input type="checkbox" data-ck="acceso_material" data-id="'+esc(r.id)+'"'+(r.acceso_material?' checked':'')+'> Grabación y material habilitados</label>'+
    '<label class="ck"><input type="checkbox" data-ck="certificado" data-id="'+esc(r.id)+'"'+(r.certificado?' checked':'')+'> Certificado habilitado</label></div>':
    '<div class="ask" style="margin-top:10px"><b>Sin cuenta en Mi aula.</b> Se anotó antes de que existiera. Creale el acceso y se genera su contraseña.<div class="acts"><button class="btn" type="button" data-a="crearacceso" data-id="'+esc(r.id)+'">Crear acceso a Mi aula</button></div></div>';
  var clave='';
  if(r.user_id){
    var p=PASS[r.id];
    if(p){
      clave='<div class="ask"><b>Nueva contraseña generada.</b> Copiala o mandala ahora: después no se puede volver a ver.<div class="res2" style="background:var(--card);border-radius:10px;padding:10px;margin:8px 0;white-space:pre-line;overflow-wrap:anywhere">'+esc(msgClave(p))+'</div>'+
        '<div class="acts"><button class="btn" type="button" data-a="clavewa" data-id="'+esc(r.id)+'">Enviar por WhatsApp</button><button class="btn ghost" type="button" data-a="clavecopy" data-id="'+esc(r.id)+'">Copiar mensaje</button><button class="btn ghost" type="button" data-a="clavecerrar" data-id="'+esc(r.id)+'">Cerrar</button></div></div>';
    }else if(RESETASK!==null&&String(RESETASK)===String(r.id)){
      clave='<div class="ask danger">¿Generar una contraseña nueva para <b>'+esc(r.nombre)+'</b>? La anterior deja de funcionar.<div class="acts"><button class="btn warn" type="button" data-a="claveok" data-id="'+esc(r.id)+'">Sí, generar</button><button class="btn ghost" type="button" data-a="cancel">No</button></div></div>';
    }else{
      clave='<button class="back" type="button" data-a="clave" data-id="'+esc(r.id)+'">Generar nueva contraseña</button>';
    }
  }
  return '<details class="row insc" data-id="'+esc(r.id)+'"'+(OPENI[r.id]?' open':'')+'><summary><div class="hd"><div class="nm"><b>'+esc(r.nombre)+'</b><small>'+esc(r.email)+'</small></div><span class="pill p'+s+'">'+ST[s]+'</span></div></summary>'+
    '<div class="cbody"><small style="display:block;color:var(--muted);margin:8px 0 0">'+esc(r.whatsapp)+'</small>'+
    '<div class="chips">'+(conTaller?'<span class="chip">'+esc(r.taller)+'</span>':'')+'<span class="chip">'+(r.modalidad==='vivo'?'En vivo':'Solo grabación')+'</span>'+(money(r)?'<span class="chip">'+esc(money(r))+'</span>':'')+'</div>'+
    cuenta+
    '<div class="ac'+(s===2?' one':'')+'"><button class="btn ghost" type="button" data-a="wa" data-id="'+esc(r.id)+'">Escribir por WhatsApp</button>'+fwd+'</div>'+back+
    (clave?'<div style="margin-top:6px">'+clave+'</div>':'')+tools('i',r)+'</div></details>';
}
document.addEventListener('input',function(e){if(e.target.id==='q'){Q=e.target.value;pintaInsc()}});
document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.classList&&d.classList.contains('insc'))OPENI[d.dataset.id]=d.open},true);
document.addEventListener('change',function(e){
  var k=e.target.dataset&&e.target.dataset.ck;
  if(k){
    var r=INS.filter(function(x){return String(x.id)===String(e.target.dataset.id)})[0];if(!r)return;
    var v=e.target.checked,d={};d[k]=v;
    patch('inscripciones',r.id,d).then(function(){r[k]=v;toast(v?'Habilitado para '+r.nombre:'Deshabilitado para '+r.nombre)}).catch(function(x){e.target.checked=!v;fallo(x)});
    return;
  }
  if(e.target.id==='pdf'&&e.target.files&&e.target.files[0])subirPdf(e.target.files[0]);
});
function slugT(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'taller'}
function pdfNombre(u){var m=String(u||'').match(/\/materiales\/([^?#]+)$/);return m?m[1]:''}
function borrarPdf(u){var n=pdfNombre(u);if(!n)return Promise.resolve();return token().then(function(tk){return fetch(SB_URL+'/storage/v1/object/materiales/'+encodeURIComponent(n),{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+tk}})}).catch(function(){})}
function subirPdf(file){
  var t=curT(),st=$('pdfst');if(!t)return;
  if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name)){st.textContent='El archivo tiene que ser un PDF.';return}
  if(file.size>50*1024*1024){st.textContent='El PDF pesa más de 50 MB. Probá con uno más liviano.';return}
  st.textContent='Subiendo '+file.name+'…';
  var rnd=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  var nombre=slugT(t.nombre)+'-'+rnd+'.pdf',viejo=t.material_url;
  token().then(function(tk){
    return fetch(SB_URL+'/storage/v1/object/materiales/'+nombre,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tk,'Content-Type':'application/pdf','x-upsert':'true'},body:file});
  }).then(function(r){
    if(r.status===401)throw new Error('AUTH');
    if(!r.ok)throw new Error('SUBIDA');
    var u=SB_URL+'/storage/v1/object/public/materiales/'+nombre;
    return patch('talleres',t.id,{material_url:u}).then(function(){t.material_url=u;if(viejo)borrarPdf(viejo);render();toast('PDF cargado')});
  }).catch(function(e){
    if(e&&e.message==='SUBIDA'){var s2=$('pdfst');if(s2)s2.textContent='No se pudo subir el PDF. Revisá que hayas corrido el paso de Supabase para los archivos.';return}
    fallo(e);
  });
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!b.dataset.a)return;
  var a=b.dataset.a,id=b.dataset.id,t=curT();
  if(a==='pdfquitar'&&t){
    var u=t.material_url;
    patch('talleres',t.id,{material_url:null}).then(function(){t.material_url=null;borrarPdf(u);render();toast('PDF quitado')}).catch(fallo);
    return;
  }
  if(a==='habtodas'&&t){
    var k=b.dataset.k,d={};d[k]=true;
    var pag=rowsOf(t).filter(function(r){return r.estado==='pago'||r.estado==='entregado'});
    if(!pag.length){toast('Todavía no hay alumnas con el pago confirmado en este taller');return}
    var conC=pag.filter(function(r){return r.user_id});
    if(!conC.length){toast('Las que pagaron no tienen cuenta en Mi aula. Tocá su nombre y creales el acceso.');return}
    var mias=conC.filter(function(r){return !r[k]});
    if(!mias.length){toast('Ya están habilitadas todas las que pagaron');return}
    api('inscripciones?taller=eq.'+encodeURIComponent(t.nombre)+'&user_id=not.is.null&estado=in.(pago,entregado)',{method:'PATCH',body:d,rep:true}).then(function(r){
      INS.forEach(function(x){if(x.taller===t.nombre&&x.user_id&&(x.estado==='pago'||x.estado==='entregado'))x[k]=true});
      pintaInsc();toast('Habilitado para '+((r&&r.length)||mias.length)+(((r&&r.length)||mias.length)===1?' alumna':' alumnas'));
    }).catch(fallo);
    return;
  }
  if(a==='crearacceso'){
    var ri=INS.filter(function(x){return String(x.id)===String(id)})[0];if(!ri)return;
    if(!String(ri.email||'').trim()){toast('A esta inscripta le falta el mail');return}
    b.disabled=true;b.textContent='Creando…';
    token().then(function(tk){
      return fetch(SB_URL+'/functions/v1/admin-clave',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({accion:'crear',email:ri.email,nombre:ri.nombre,whatsapp:ri.whatsapp})});
    }).then(function(res){
      if(res.status===404)throw new Error('SINFN');
      return res.json().then(function(j){if(!res.ok)throw new Error(j&&j.error||'ERR');return j});
    }).then(function(j){
      if(j.password)PASS[ri.id]={password:j.password,email:j.email,nombre:ri.nombre};
      OPENI[ri.id]=true;
      return cargar().then(function(){render();toast(j.password?'Acceso creado':'Ese mail ya tenía cuenta: se vincularon '+j.vinculadas+(j.vinculadas===1?' inscripción':' inscripciones'))});
    }).catch(function(x){
      pintaInsc();
      if(x&&x.message==='SINFN')toast('Falta activar la función de contraseñas en Supabase');
      else if(x&&x.message==='AUTH')fallo(x);
      else toast('No se pudo crear el acceso');
    });
    return;
  }
  if(a==='clave'){RESETASK=id;pintaInsc();return}
  if(a==='clavecerrar'){delete PASS[id];pintaInsc();return}
  if(a==='claveok'){
    var r=INS.filter(function(x){return String(x.id)===String(id)})[0];if(!r)return;
    b.disabled=true;b.textContent='Generando…';
    token().then(function(tk){
      return fetch(SB_URL+'/functions/v1/admin-clave',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({user_id:r.user_id})});
    }).then(function(res){
      if(res.status===404)throw new Error('SINFN');
      return res.json().then(function(j){if(!res.ok||!j.password)throw new Error(j&&j.error||'ERR');return j});
    }).then(function(j){PASS[r.id]={password:j.password,email:j.email||r.email,nombre:r.nombre};RESETASK=null;OPENI[r.id]=true;pintaInsc()})
    .catch(function(x){
      RESETASK=null;pintaInsc();
      if(x&&x.message==='SINFN')toast('Falta activar la función de contraseñas en Supabase');
      else if(x&&x.message==='AUTH')fallo(x);
      else toast('No se pudo generar la contraseña');
    });
    return;
  }
  if(a==='clavewa'||a==='clavecopy'){
    var q=PASS[id];if(!q)return;
    var inc=INS.filter(function(x){return String(x.id)===String(id)})[0];
    if(a==='clavewa'){window.open('https://wa.me/'+waNum(inc?inc.whatsapp:'')+'?text='+encodeURIComponent(msgClave(q)),'_blank');return}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msgClave(q)).then(function(){toast('Mensaje copiado')},function(){toast('No se pudo copiar')});else toast('No se pudo copiar');
    return;
  }
});

loadSes();
if(SES)start();else showLogin('');
</script>
